name: Do release

on:
  pull_request:
    branches: main
    types: [closed]

jobs:
  get_description:
    name: Get version and description from the CHANGELOG.md and overview.txt files
    uses: $/.github/workflows/create_release_description.yml

  tag_release:
    name: Release on GitHub
    needs: [get_description]
    runs-on: ubuntu-slim
    if: ${{ github.event.pull_request.merged }}
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ssh-key: ${{ secrets.RELEASE_KEY }}

      - name: Tag the released version with a version tag
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git tag -a -m "Release ${{ needs.get_description.outputs.version }}" "v${{ needs.get_description.outputs.version }}" "${{ github.event.pull_request.merge_commit_sha }}"
          git push --tags

      - name: Make a GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.get_description.outputs.version }}
          name: Sanotehu ${{ needs.get_description.outputs.version }}
          body: ${{ fromJSON(needs.get_description.outputs.description) }}

      - name: Merge main back into develop
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git fetch --all
          git switch develop
          git merge --no-ff -X theirs main
          git push

  build-python-packages:
    name: Build and test Python packages
    needs: [get_description, tag_release]
    uses: $/.github/workflows/build_test_python_packages.yml
    with:
      ref: v${{ needs.get_description.outputs.version }}

  publish-to-pypi:
    name: Publish to TestPyPI
    needs: [build-python-packages]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sanotehu
    permissions:
      id-token: write
    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish packages to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

