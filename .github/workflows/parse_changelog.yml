name: Parse changelog

on:
  workflow_call:
    outputs:
      changes:
        description: |
          JSON string containing changes for this version from the CHANGELOG file
        value: ${{ jobs.parse_changelog.outputs.changes }}

jobs:
  parse_changelog:
    name: Extract the changes for the most recent CHANGELOG.md entry
    runs-on: ubuntu-slim
    outputs:
      changes: ${{ steps.parse_changelog.outputs.changes }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - id: parse_changelog
        name: Parse CHANGELOG.md
        run: |
          CHANGES="$(awk 'BEGIN {s=0} ; $1=="##" {s=s+1;next} ; $1 ~ /^##/ ($0 = substr($0, 2)) ; s==1 {print}' CHANGELOG.md | awk -v RS="\0" -v ORS="" '{gsub(/\n/,"\\n") ; printf "\"%s\"",$0}')"
          echo "changes=$CHANGES" >> $GITHUB_OUTPUT

